<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Hidden Letters</title>
<style>
  @font-face{font-family:"Lilita One";src:url(fonts/lilita-one-latin-400-normal.woff2) format("woff2");font-weight:400;font-display:block;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
  @font-face{font-family:"Lilita One";src:url(fonts/lilita-one-latin-ext-400-normal.woff2) format("woff2");font-weight:400;font-display:block;unicode-range:U+0100-02AF,U+0304,U+0308,U+0329,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20CF,U+2113,U+2C60-2C7F,U+A720-A7FF}
  html,body{margin:0;height:100%;overflow:hidden;background:#7fd6ff;overscroll-behavior:none}
  #cv{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  /* a font is only fetched once something uses it, so keep a hidden sample around */
  #fontprime{position:absolute;left:-99px;top:-99px;font-family:"Lilita One";opacity:0}
</style>
</head>
<body>
<canvas id="cv" aria-label="Hidden Letters game"></canvas>
<span id="fontprime">Aa</span>
<script src="data/levels.js"></script>
<script src="js/gfx.js"></script>
<script src="js/sfx.js"></script>
<script src="js/qr.js"></script>
<script src="js/game.js"></script>
</body>
</html>
